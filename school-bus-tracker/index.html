<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3B82F6">
  <meta name="description" content="Real-time school bus tracking application">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bus Tracker">
  
  <title>School Bus Tracker</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Maps API - Replace with your actual API key -->
  <script>
    // Load Google Maps dynamically only when needed
    window.loadGoogleMaps = function() {
      if (window.google && window.google.maps) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?libraries=geometry,places&callback=initMap';
        script.async = true;
        script.defer = true;
        window.initMap = () => resolve();
        script.onerror = () => reject();
        document.head.appendChild(script);
      });
    };
  </script>
  
  <style>
    /* Custom styles */
    .map-container { width: 100%; height: 100%; min-height: 300px; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    .bus-pulse { animation: pulse 2s infinite; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Status indicators */
    .status-online { background-color: #10B981; }
    .status-offline { background-color: #EF4444; }
    
    /* Smooth transitions */
    .transition-all-200 { transition: all 0.2s ease; }
    
    /* Loading spinner */
    .spinner { border: 3px solid rgba(0,0,0,0.1); border-top-color: #3B82F6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            secondary: '#10B981',
            danger: '#EF4444',
            warning: '#F59E0B',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app"></div>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW error:', err));
    }
  </script>
  
  <script src="js/app.js"></script>
</body>
</html>
